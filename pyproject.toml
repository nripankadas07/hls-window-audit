[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "hls-window-audit"
version = "0.1.0"
description = "Parse bounded media playlists, compare overlapping sequence identities, trace discontinuity counters, identify gaps/regressions, and apply RFC-style rounded target-duration checks."
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [{name = "Nripanka Das"}]
[project.scripts]
hls-window-audit = "hls_window_audit:main"
[project.urls]
Source = "https://github.com/nripankadas07/hls-window-audit"
Issues = "https://github.com/nripankadas07/hls-window-audit/issues"
[tool.setuptools]
py-modules = ["hls_window_audit"]
